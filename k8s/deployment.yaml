apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-app
  template:
    metadata:
      labels:
        app: gitops-app
    spec:
      containers:
        - name: gitops-app
          image: aayodipe/gitops-app:16b72127e3cedcfae589c45d9b9a0bab065617f6
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-app-svc
spec:
  selector:
    app: gitops-app
  ports:
    - port: 80
  type: ClusterIP
